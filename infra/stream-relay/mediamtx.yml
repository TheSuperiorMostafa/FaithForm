# FaithForm stream relay — MediaMTX config
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 127.0.0.1:9997

metrics: no

rtmp: yes
rtmpAddress: :1935

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: mpegts
# 2s segments. Every playlist and segment reaches viewers through FaithForm's
# authorizing proxy, and players fetch segments one after another, so each
# request has to finish well inside one segment's duration or playback can
# never keep up. At 1s it could not: the apps loaded the playlist and then
# watched every segment 404, because it had been deleted by the time the
# request arrived. The encoder still emits a keyframe every second, so each
# segment is exactly two GOPs. Latency is about three segments behind live.
hlsSegmentDuration: 2s
# The playlist must expose enough history that a viewer who briefly stalls can
# still find their position — and a segment is deleted the moment it leaves
# the playlist. 12 segments gives a 24s window.
hlsSegmentCount: 12
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts:
  - 87.99.156.133
  - stream.faithform.io
webrtcHandshakeTimeout: 30s
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
srt: yes
srtAddress: :8890

pathDefaults:
  source: publisher
  # Auth is injected at runtime with MTX_AUTHMETHOD + MTX_AUTHHTTPADDRESS
  # from /etc/faithform-stream-relay.env.

paths:
  # Per-church ingest:
  #   server: rtmp://stream.faithform.io/live
  #   stream key: {churchId}?token={short-lived capability}
  # The query is used only for auth; the media path remains live/{churchId}.
  ~^live/([0-9a-fA-F-]{36})$:
    source: publisher
    runOnReady: /home/mostafa/scripts/on-stream-ready.sh
    runOnReadyRestart: yes
    runOnNotReady: /home/mostafa/scripts/on-stream-stop.sh
