# FaithForm stream relay — MediaMTX config
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: 127.0.0.1:9997

metrics: no

rtmp: yes
rtmpAddress: :1935

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: mpegts
# 1s segments keep latency low (the encoder emits a keyframe every 30 frames at
# 30fps, so segments align exactly with GOP boundaries).
hlsSegmentDuration: 1s
# The playlist must expose enough history that a viewer who briefly stalls can
# still find their position. At 4 segments the whole live window was 4s, so any
# hiccup longer than that dropped the player off the playlist and forced a
# rebuffer. 8 gives an 8s window without changing latency.
hlsSegmentCount: 8
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts:
  - 87.99.156.133
  - stream.faithform.io
webrtcHandshakeTimeout: 30s
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
srt: yes
srtAddress: :8890

pathDefaults:
  source: publisher
  # Auth is injected at runtime with MTX_AUTHMETHOD + MTX_AUTHHTTPADDRESS
  # from /etc/faithform-stream-relay.env.

paths:
  # Per-church ingest:
  #   server: rtmp://stream.faithform.io/live
  #   stream key: {churchId}/{publishKey}
  ~^live/([0-9a-fA-F-]{36})/([A-Za-z0-9_-]{16,})$:
    source: publisher
    runOnReady: /home/mostafa/scripts/on-stream-ready.sh
    runOnReadyRestart: yes
    runOnNotReady: /home/mostafa/scripts/on-stream-stop.sh
