# The iOS application target.
#
# Generated from this file rather than committed as a `.pbxproj`, so what the
# app is remains readable and reviewable: a project file is 2,000 lines of
# machine-ordered UUIDs that nobody can diff, and merge conflicts in one are
# resolved by guessing.
#
# Run `pnpm ios:app:generate` before opening Xcode. `pnpm ios:app:build` does it
# for you.
name: FaithForm
options:
  bundleIdPrefix: io.faithform
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Every target's warnings are failures. A warning in a target nobody compiles
  # daily is a warning nobody will ever see again — the lesson from the
  # AVFoundation concurrency break that sixteen green gates missed.
  defaultConfig: Debug

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Automatic signing, with **no team in source** — Xcode fills that in from
    # whoever opens it.
    #
    # Signing is *not* disabled here. It used to be, so the CI build would work
    # on a machine with no Apple account, and the cost was that Xcode could not
    # sign it either: "The executable is not codesigned" on every device run,
    # with no way out short of editing the project.
    #
    # `scripts/build-ios-app.sh` passes `CODE_SIGNING_ALLOWED=NO` on the command
    # line instead. That turns signing off for exactly the build that needs it
    # off, and leaves the IDE alone.
    CODE_SIGN_STYLE: Automatic

packages:
  StreamChatSwiftUI:
    url: https://github.com/GetStream/stream-chat-swiftui.git
    exactVersion: 5.11.0
  FaithFormKit:
    path: .

targets:
  FaithForm:
    type: application
    platform: iOS
    sources:
      - path: App
        # Everything under App/ is compiled or bundled unless it is listed here.
        # These two are for the people building the app, not for the people
        # installing it: the example config names a Team ID placeholder, and
        # the asset check is run from its path by the build phase below. Both
        # used to be copied into the shipped .app.
        excludes:
          - Configuration/Local.xcconfig.example
          - Scripts/check-assets.sh
    dependencies:
      - package: StreamChatSwiftUI
        product: StreamChatSwiftUI
      - package: FaithFormKit
        product: FaithFormKit
    configFiles:
      Debug: App/Configuration/Debug.xcconfig
      Staging: App/Configuration/Staging.xcconfig
      Release: App/Configuration/Release.xcconfig
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      # Device Debug builds need APNs too. Without this entitlement iOS refuses
      # registration even when the person has allowed notifications. A personal
      # team without Push capability can explicitly clear CODE_SIGN_ENTITLEMENTS
      # for a build that does not exercise remote notifications.
      #
      # **Which** entitlements file is a switch, not a constant. Apple Pay needs
      # `com.apple.developer.in-app-payments`, and a profile without that
      # capability fails to sign an app that declares it. FAITHFORM_ENTITLEMENTS
      # resolves to the plain file unless FAITHFORM_ENABLE_APPLE_PAY is YES — see
      # Base.xcconfig, where the same switch decides whether the app is told a
      # merchant ID, so the two cannot disagree.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/Resources/FaithForm.entitlements
        Staging:
          CODE_SIGN_ENTITLEMENTS: $(FAITHFORM_ENTITLEMENTS)
        Release:
          CODE_SIGN_ENTITLEMENTS: $(FAITHFORM_ENTITLEMENTS)
    preBuildScripts:
      - name: Placeholder assets must be replaced
        script: '"$SRCROOT/App/Scripts/check-assets.sh"'
        basedOnDependencyAnalysis: false
        # Declared so the user-script sandbox permits reading them. Without
        # these the sandbox denies the script its own file, which reads as a
        # permissions error rather than as a missing declaration.
        inputFiles:
          - $(SRCROOT)/App/Scripts/check-assets.sh
          - $(SRCROOT)/App/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
        outputFiles:
          - $(DERIVED_FILE_DIR)/asset-check.stamp

  FaithFormAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: FaithForm
      - package: FaithFormKit
        product: FaithFormKit
    settings:
      base:
        # A host application is required: these tests assert what the *app*
        # composes, which does not exist without one.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FaithForm.app/FaithForm
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  FaithForm:
    build:
      targets:
        FaithForm: all
        FaithFormAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FaithFormAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FaithForm-Staging:
    build:
      targets:
        FaithForm: all
    run:
      config: Staging
    archive:
      config: Staging
